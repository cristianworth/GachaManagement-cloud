<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Management</title>
    
    <!-- Dynamic base href for different environments -->
    <script>
        // No GitHub Pages, deriva o nome do repositório do primeiro segmento da
        // URL. Assim funciona em qualquer repo (ex.: /GachaManagement/ ou
        // /GachaManagement-cloud/) sem precisar fixar o nome aqui.
        if (window.location.hostname.includes('github.io')) {
            const repo = window.location.pathname.split('/')[1];
            if (repo) {
                document.write(`<base href="/${repo}/" />`);
            }
        }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- External Library: Supabase (banco na nuvem, sincroniza navegador/celular) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Script -->
    <script type="module" src="js/index.js"></script>
</head>

<body>
    <div id="loadingOverlay" class="loading-overlay" hidden aria-live="polite" aria-busy="true">
        <div class="loading-content" role="status">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span class="loading-message">Processing...</span>
        </div>
    </div>

    <!-- Games List Page -->
    <div data-page="games">
        <section>
            <h1 class="main-title">
                <a href="https://cristianworth.github.io/GachaManagement-cloud/" target="_blank">
                    Gacha Management <span class="version-badge">v1.3.0</span>
                </a>
                <br>
                <a href="https://github.com/cristianworth/GachaManagement-cloud/tree/main" target="_blank">Dev Repo</a>
            </h1>

            <button id="createGameBtn" class="button-add"><span class="button-icon" aria-hidden="true">+</span> Create New Game</button>
            <button id="viewTasksBtn" class="button-neutral"><span class="button-icon" aria-hidden="true">&#9776;</span> View Tasks</button>
            
            <div class="table-container">
                <table id="gameList">
                <thead>
                    <tr>
                        <th>Icon</th>
                        <th>Game</th>
                        <th>To-do</th>
                        <th>Stamina</th>
                        <th>Max Stamina At</th>
                    </tr>
                </thead>
                <tbody id="gameListBody">
                    <!-- Data will be populated automatically -->
                </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Create Game Page -->
    <div data-page="createGame" style="display:none">
        <section>
            <h1 id="game-form-title" class="main-title">Create/Edit Game</h1>
            <button id="backToGamesBtn" class="button-neutral"><span class="button-icon" aria-hidden="true">&#8592;</span> Back to Games</button>
            
            <form id="game-form">
                <label for="gameId" hidden>Id:</label>
                <input id="gameId" type="number" hidden>

                <label for="gameDescription">Name of the game:</label>
                <input id="gameDescription" type="text" required/>
                
                <label for="abbreviation">Abbreviation:</label>
                <input id="abbreviation" type="text" required/>
                
                <label for="capStamina">Cap Stamina:</label>
                <input id="capStamina" value="240" type="text" required/>
                
                <label for="staminaPerMinute">Stamina p/ Minute:</label>
                <input id="staminaPerMinute" value="6" type="text" required/>
                
                <button id="submitGameForm" class="button-save" type="submit"><span class="button-icon" aria-hidden="true">&#10003;</span> Save / Update</button>
            </form>
        </section>
    </div>

    <!-- Task List Page -->
    <div data-page="taskList" style="display:none">
        <section>
            <h1 class="main-title">Task List</h1>
            <button id="backToGamesFromTasksBtn" class="button-neutral"><span class="button-icon" aria-hidden="true">&#8592;</span> Back to Games</button>
            <button id="createTaskBtn" class="button-add"><span class="button-icon" aria-hidden="true">+</span> Create New Task</button>
            <button id="reviewEventsBtn" class="button-neutral" type="button">Revisar eventos (<span id="eventReviewCount">0</span>)</button>

            <div class="task-filters">
                <label for="taskGameFilter">Game</label>
                <select id="taskGameFilter"><option value="">All games</option></select>
                <label for="taskRefreshTypeFilter">Refresh Type</label>
                <select id="taskRefreshTypeFilter"><option value="">All refresh types</option></select>
                <span id="taskListStatus" role="status" aria-live="polite"></span>
            </div>

            <div class="table-container">
                <table id="gameSchedule">
                <thead>
                    <tr>
                        <th hidden>ID</th>
                        <th>Done?</th>
                        <th>Game</th>
                        <th>Task</th>
                        <th>Refresh Type</th>
                        <th>Ending Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="gameScheduleBody">
                    <!-- Data will be populated automatically -->
                </tbody>
                </table>
            </div>
        </section>
    </div>

    <div data-page="eventGames" style="display:none">
        <section>
            <h1 class="main-title">Revisar eventos</h1>
            <button id="backToTasksFromEventsBtn" class="button-neutral">← Back to Tasks</button>
            <p id="eventGamesStatus" aria-live="polite"></p>
            <div id="eventGamesList" class="event-games-list"></div>
        </section>
    </div>

    <div data-page="eventReview" style="display:none">
        <section>
            <h1 id="eventReviewTitle" class="main-title">Eventos encontrados</h1>
            <button id="backToEventGamesBtn" class="button-neutral">← Selecionar outro jogo</button>
            <p id="eventReviewStatus" aria-live="polite"></p>
            <ul id="eventReviewList" class="event-review-list"></ul>
        </section>
    </div>

    <!-- Create Task Page -->
    <div data-page="createTask" style="display:none">
        <section>
            <h1 id="task-form-title" class="main-title">Create/Edit Task</h1>
            <button id="backToTasksBtn" class="button-neutral"><span class="button-icon" aria-hidden="true">&#8592;</span> Back to Tasks</button>
            
            <form id="task-form">
                <label for="taskId" hidden>Id:</label>
                <input id="taskId" type="number" hidden>
                
                <label for="taskGameId">Game:</label>
                <select id="taskGameId"></select>
                
                <label for="taskDescription">Task:</label>
                <input id="taskDescription" type="text" required/>
                
                <label for="hasDateSelector">Use Date Selector:</label>
                <input id="hasDateSelector" type="checkbox">

                <div id="divExpirationDayAndHour">
                    <label for="expirationDay">Expiration Day:</label>
                    <input id="expirationDay" type="number" value="0" required/>
                
                    <label for="expirationHour">Expiration Hour:</label>
                    <input id="expirationHour" type="number" value="0" required/>    
                </div>

                <div id="divExpirationDate" hidden>
                    <label for="expirationDate">Date:</label>
                    <input id="expirationDate" type="datetime-local" step="1"/>
                </div>

                <label for="refreshType">Refresh Type:</label>
                <select id="refreshType"></select>
                
                <button id="submitTaskForm" class="button-save" type="submit"><span class="button-icon" aria-hidden="true">&#10003;</span> Save / Update</button>
            </form>
        </section>
    </div>
</body>
</html>
