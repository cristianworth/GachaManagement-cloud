<!-- 404.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const pathname = window.location.pathname;
    const repo = window.location.hostname.includes('github.io') ? pathname.split('/')[1] : '';
    const base = repo ? `/${repo}` : '';
    const demoBase = `${base}/demo`;
    const routeBase = pathname.startsWith(`${demoBase}/`) ? demoBase : base;
    const path = pathname.slice(routeBase.length) || '/';
    window.location.replace(`${routeBase}/${window.location.search}#${path}`);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
