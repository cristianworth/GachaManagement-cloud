name: Sync game events

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: game-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify offline contracts before touching event data
        run: npm test
      - name: Import Genshin, HSR, ZZZ, WuWa and NTE events and keep deadline exceptions for review
        run: node scripts/syncEvents.js
